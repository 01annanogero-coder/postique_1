services:
  postique:
    build: .
    restart: unless-stopped
    ports:
      # Bind to loopback by default; expose through a TLS reverse proxy.
      - "${POSTIQUE_HTTP_BIND:-127.0.0.1}:3000:3000"
      # Only expose inbound SMTP after configuring TLS and MX. Set
      # POSTIQUE_SMTP_BIND=0.0.0.0 when the host is a public MX.
      - "${POSTIQUE_SMTP_BIND:-127.0.0.1}:2525:2525"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATA_DIR: /data
      INBOUND_SMTP_ENABLED: "true"
      INBOUND_SMTP_HOST: 0.0.0.0
      INBOUND_SMTP_PORT: 2525
    volumes:
      - postique-data:/data

  mail-gateway:
    build: .
    command: ["node", "adapter/server.mjs"]
    profiles: ["mail-gateway"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      PORT: 8787
      ADAPTER_TOKEN: ${MAIL_ADAPTER_TOKEN}
      SMTP_URL: ${SMTP_URL}
    ports:
      - "${ADAPTER_BIND:-127.0.0.1}:8787:8787"

volumes:
  postique-data:
